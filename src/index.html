<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Site Name</title>
<meta name="description" content="Welcome page">

<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ============ TOP NAVBAR (fixed, full width) ============ -->
<header class="topbar">
  <a href="#" class="site-name" id="site-home-link">
    Site Name<br>
    <span class="muted tagline" id="topbar-tagline"></span>
  </a>
  <div class="clock" id="clock-time"></div>
</header>

<div class="layout">

  <!-- ============ LEFT SIDEBAR — projects list ============ -->
  <nav class="sidebar">
    <ol id="nav-projects" style="list-style: none;"><!-- injected --></ol>
  </nav>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="content">

    <!-- ---------- HOME VIEW — just a centered image + text/links ---------- -->
    <section id="view-home" class="view view-home">
      <img id="home-image" class="home-image" src="" alt="">
      <div class="home-text" id="home-text"></div>
      <div class="home-links" id="home-links"><!-- injected --></div>
    </section>

    <!-- ---------- PROJECT VIEW (shown/hidden by script.js) ---------- -->
    <section id="view-project" class="view view-project" hidden>
      <!-- <a href="#" class="back-link">← Index</a> -->
      <div id="project-detail"><!-- injected --></div>
    </section>

    <footer class="footer">
      <span class="muted" id="footer-copyright"></span>
    </footer>

  </main>

</div>

<script src="assets/config.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
